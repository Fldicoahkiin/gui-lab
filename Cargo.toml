[package]
name = "amenui"
version = "0.0.1"
edition = "2024"
description = "A self-drawn interface framework in Rust: every glyph, shape and picture has a true outline that can loosen, morph and come back together"
license = "MIT"
readme = "README.md"
keywords = ["gui", "ui", "wgpu", "accessibility", "wasm"]
categories = ["gui", "graphics", "rendering", "wasm"]
# The toolchain CI builds and tests with.
rust-version = "1.97"
# The crate carries what the library compiles in (assets, docs, examples, registry.json, web/) and the
# tests; CI stays in the repository.
exclude = [".github/", "target/"]
repository = "https://github.com/amenui-dev/amenui"
homepage = "https://github.com/amenui-dev/amenui"
# The files in examples/ are the recipes (docs/recipes/): compiled into the library as `amenui::recipes`.
autoexamples = false

[features]
default = ["gltf", "window", "system-fonts"]
# A small glTF 2.0 reader (`mesh::load_gltf`): positions, normals, indices and node transforms.
gltf = []
# The native window (`app::native::run`): winit, and the system clipboard through arboard.
window = ["dep:winit", "dep:arboard", "dep:accesskit", "dep:accesskit_winit"]
# The system's installed fonts as the last fallback (`text::Face::system`), for scripts the bundled
# faces lack. fontconfig is loaded at run time on Linux, so building needs no C library.
system-fonts = ["parley/system", "dep:fontique"]
# Dictionaries for line breaking in Thai, Lao, Khmer and Burmese (a few MB in the binary).
complex-scripts = ["parley/complex-scripts"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgl", "webgpu", "vulkan", "std"] }
parley = { version = "0.13", default-features = false, features = ["std"] }
swash = "0.2"
taffy = "0.15"
unicode-segmentation = "1"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Plural categories for the message catalogs (i18n.rs): CLDR's rules, no other machinery.
intl_pluralrules = "7"
# Liang hyphenation with the en-US patterns embedded, for Latin text that flows around obstacles (wrap.rs).
hyphenation = { version = "0.8", default-features = false, features = ["embed_en-us"] }
unic-langid = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"
fontique = { version = "0.13", default-features = false, features = ["system", "fontconfig-dlopen"], optional = true }
winit = { version = "0.30", optional = true }
# X11 through x11rb, no C libraries.
arboard = { version = "3", default-features = false, optional = true }
# Native screen readers (UI Automation, NSAccessibility, AT-SPI) for the window.
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", optional = true }

# macOS draws through Metal (Vulkan is not there without a translation layer).
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance", "HtmlCanvasElement", "console"] }
# The web entry (`app::web`, `web_app!`): the exports the page calls.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true

# For iterating on the tools: optimised, but without the slow link-time step.
[profile.quick]
inherits = "release"
lto = false
incremental = true
codegen-units = 16
