[package]
name = "lab"
version = "0.0.1"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgl", "webgpu", "vulkan", "std"] }
parley = { version = "0.13", default-features = false, features = ["std"] }
swash = "0.2"
taffy = "0.15"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "console"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
