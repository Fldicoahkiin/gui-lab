<title>gui-lab</title>
<style>
  /* One canvas fills the view. Everything inside it is drawn by the framework. */
  html, body { height: 100%; }
  body { background: #0c0d0e; color: #e2e3e0; font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
</style>
<div id="stage">
  <canvas id="c" tabindex="0"></canvas>
  <div id="msg">正在载入…</div>
</div>
<script>__GLUE__</script>
<script>
(async () => {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const msg = document.getElementById('msg'), canvas = document.getElementById('c'), stage = document.getElementById('stage');
  try {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const fit = () => { const r = stage.getBoundingClientRect(); canvas.width = Math.max(1, Math.floor(r.width * dpr)); canvas.height = Math.max(1, Math.floor(r.height * dpr)); };
    fit();
    await wasm_bindgen({ module_or_path: b64("__WASM__") });
    const w = wasm_bindgen;
    await w.start(canvas, b64("__SANS__"), b64("__PIXEL__"), b64("__MONO__"), dpr, location.hash);
    msg.remove();
    canvas.focus();
    const now = () => performance.now() / 1000;
    const at = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    // The page is in the hash (plain names such as #button), so it can be linked; Back goes back.
    const sync = () => { const h = '#' + w.hash(); if (location.hash !== h) location.hash = h; };
    window.addEventListener('hashchange', () => { if (!w.route(location.hash)) sync(); });
    sync();
    // Frames on demand: the animation-frame loop runs only while the framework needs frames; when it
    // does not, the loop stops, and input or a timed wake (the caret's blink, a clock) starts it again.
    let raf = 0, timer = 0;
    const loop = () => {
      raf = 0; if (timer) { clearTimeout(timer); timer = 0; }
      const d = w.frame(now());
      if (d === 0) raf = requestAnimationFrame(loop);
      else if (d > 0) timer = setTimeout(kick, d * 1000);
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
    canvas.addEventListener('pointermove', e => { w.pointer_move(...at(e), now()); kick(); });
    canvas.addEventListener('pointerleave', () => { w.pointer_leave(now()); kick(); });
    canvas.addEventListener('pointerdown', e => { canvas.focus(); canvas.setPointerCapture(e.pointerId); const [x, y] = at(e); w.pointer_move(x, y, now()); w.pointer_down(x, y, now()); sync(); kick(); });
    canvas.addEventListener('pointerup', e => { w.pointer_up(...at(e), now()); sync(); kick(); });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? canvas.clientHeight : 1;
      w.wheel(...at(e), e.deltaX * k, e.deltaY * k, now()); kick();
    }, { passive: false });
    window.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (w.key(e.key, e.shiftKey, now()) || e.key === 'Tab') e.preventDefault();
      sync(); kick();
    });
    window.addEventListener('keyup', e => { w.key_up(e.key, now()); sync(); kick(); });
    window.addEventListener('hashchange', kick);
    new ResizeObserver(() => { fit(); w.resize(canvas.width, canvas.height, dpr); kick(); }).observe(stage);
    kick();
  } catch (e) { msg.textContent = '这个浏览器没能启动图形功能：' + (e && e.message ? e.message : e); console.error(e); }
})();
</script>
