<title>界面骨架</title>
<style>
  /* One canvas fills the view. Everything inside it is drawn by the framework. */
  html, body { height: 100%; }
  body { background: #0c0d0e; color: #e2e3e0; font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
</style>
<div id="stage">
  <canvas id="c" tabindex="0"></canvas>
  <div id="msg">正在载入…</div>
</div>
<script>__GLUE__</script>
<script>
(async () => {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const msg = document.getElementById('msg'), canvas = document.getElementById('c'), stage = document.getElementById('stage');
  try {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const fit = () => { const r = stage.getBoundingClientRect(); canvas.width = Math.max(1, Math.floor(r.width * dpr)); canvas.height = Math.max(1, Math.floor(r.height * dpr)); };
    fit();
    await wasm_bindgen({ module_or_path: b64("__WASM__") });
    const w = wasm_bindgen;
    await w.start(canvas, b64("__FONT__"), dpr);
    msg.remove();
    canvas.focus();
    const now = () => performance.now() / 1000;
    const at = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    canvas.addEventListener('pointermove', e => w.pointer_move(...at(e)));
    canvas.addEventListener('pointerleave', () => w.pointer_leave());
    canvas.addEventListener('pointerdown', e => { canvas.focus(); canvas.setPointerCapture(e.pointerId); const [x, y] = at(e); w.pointer_move(x, y); w.pointer_down(x, y, now()); });
    canvas.addEventListener('pointerup', e => w.pointer_up(...at(e)));
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? canvas.clientHeight : 1;
      w.wheel(...at(e), e.deltaY * k);
    }, { passive: false });
    window.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (w.key(e.key, e.shiftKey, now()) || e.key === 'Tab') e.preventDefault();
    });
    new ResizeObserver(() => { fit(); w.resize(canvas.width, canvas.height, dpr); }).observe(stage);
    const loop = () => { w.frame(now()); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } catch (e) { msg.textContent = '这个浏览器没能启动图形功能：' + (e && e.message ? e.message : e); console.error(e); }
})();
</script>
